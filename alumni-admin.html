<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alumni Management</title>

<link rel="stylesheet" href="dashboard.css">

<style>

.content{
    margin-left:260px;
    padding:40px;
}

.content h1{
    color:#002855;
    margin-bottom:30px;
}

.form-box{

    max-width:700px;

    background:#fff;

    padding:30px;

    border-radius:12px;

    box-shadow:0 5px 15px rgba(0,0,0,.1);

}

.form-box h2{

    color:#002855;

    margin-bottom:20px;

}

input{

    width:100%;

    padding:12px;

    margin-bottom:18px;

    border:1px solid #ccc;

    border-radius:8px;

    font-size:16px;

}

button{

    width:100%;

    background:#004080;

    color:white;

    border:none;

    padding:14px;

    font-size:17px;

    border-radius:8px;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    background:#002855;

}

#status{

    margin-top:20px;

    font-weight:bold;

}

#previewImage{

    display:none;

    width:180px;

    height:180px;

    object-fit:contain;

    background:#f5f5f5;

    border:2px solid #004080;

    border-radius:10px;

    padding:8px;

    margin:20px auto;

}

</style>

</head>

<body>

<div class="sidebar">

<h2>MMI Admin</h2>

<ul>

<li><a href="dashboard.html">🏠 Dashboard</a></li>

<li><a href="manage-notices.html">📢 Manage Notices</a></li>

<li><a href="gallery-admin.html">📤 Upload Gallery Images</a></li>

<li><a href="manage-gallery.html">🗑 Delete Gallery Images</a></li>

<li><a href="teacher-admin.html">➕ Add Teacher</a></li>

<li><a href="manage-teachers.html">🗑 Delete Teachers</a></li>

<li><a href="alumni-admin.html">🎓 Add Alumni</a></li>

<li><a href="manage-alumni.html">🗑 Delete Alumni</a></li>
<li><a href="downloads-admin.html">📄 Upload Downloads</a></li>

<li><a href="manage-downloads.html">🗑 Manage Downloads</a></li>

<li><a href="admin.html">🚪 Logout</a></li>

</ul>

</div>

<div class="content">

<div class="form-box">

<h1>🎓 Alumni Management</h1>

<h2>Add New Alumni</h2>

<input type="file" id="alumniPhoto" accept="image/*">

<img id="previewImage">

<input type="text" id="alumniName" placeholder="Alumni Name">

<input type="text" id="alumniBatch" placeholder="Batch (Example: 2022)">

<input type="text" id="alumniProfession" placeholder="Profession">

<input type="email" id="alumniEmail" placeholder="Email Address">

<button id="uploadBtn">

Add Alumni

</button>

<p id="status"></p>

</div>

</div>

<script>

const alumniPhoto=document.getElementById("alumniPhoto");

alumniPhoto.addEventListener("change",function(){

const file=this.files[0];

if(file){

const reader=new FileReader();

reader.onload=function(e){

const preview=document.getElementById("previewImage");

preview.src=e.target.result;

preview.style.display="block";

}

reader.readAsDataURL(file);

}

});

</script>

<script type="module" src="alumni-admin.js"></script>

</body>

</html>
