<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Proud Alumni | Maryam Memorial Institute</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fa;
}

.page-title{

    background:#004080;
    color:white;
    text-align:center;
    padding:25px;

}

.page-title h1{

    margin:0;

}

.alumni-container{

    max-width:1200px;
    margin:40px auto;
    padding:20px;

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));

    gap:30px;

}

.alumni-card{

    background:white;

    border-radius:12px;

    box-shadow:0 5px 15px rgba(0,0,0,.12);

    overflow:hidden;

    transition:.3s;

}

.alumni-card:hover{

    transform:translateY(-5px);

}
.alumni-card img{

    width:100%;
    height:250px;

    object-fit:contain;

    background:#f5f5f5;

    padding:10px;

}

.alumni-info{

    padding:20px;

}

.alumni-info h3{

    margin:0;
    color:#004080;

}

.alumni-info p{

    margin:8px 0;
    color:#555;

}

.back-home{

    text-align:center;
    margin:40px;

}

.back-home a{

    background:#004080;
    color:white;
    text-decoration:none;
    padding:12px 25px;
    border-radius:8px;

}

.back-home a:hover{

    background:#002855;

}

</style>

</head>

<body>

<div class="page-title">

<h1>🎓 Proud Alumni</h1>

<p>Our successful students who make us proud.</p>

</div>

<div
id="alumniContainer"
class="alumni-container">

</div>

<div class="back-home">

<a href="index.html">

← Back to Home

</a>

</div>

<script type="module" src="alumni.js"></script>

</body>

</html>
