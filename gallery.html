<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery - Maryam Memorial Institute</title>

<style>

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

/* HEADER */

header{
    background:#002855;
    color:white;
    text-align:center;
    padding:25px;
}

header img{
    width:100px;
    border-radius:50%;
    background:white;
    padding:5px;
    margin-bottom:15px;
}

header h1{
    font-size:42px;
    margin-bottom:10px;
}

header p{
    font-size:18px;
}

/* NAVBAR */

nav{
    background:#004080;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:15px;
    font-size:18px;
    font-weight:bold;
    transition:0.3s;
}

nav a:hover{
    color:yellow;
}

/* GALLERY SECTION */

.gallery-section{
    padding:60px 20px;
}

.gallery-section h2{
    text-align:center;
    font-size:45px;
    color:#002855;
    margin-bottom:40px;
}

/* GALLERY GRID */

.gallery-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
    max-width:1300px;
    margin:auto;
}
#latestGallery{
    grid-template-columns:repeat(auto-fill, minmax(280px,280px));
    justify-content:center;
}
.gallery-grid img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    transition:.3s;
    display:block;
}

.gallery-grid img:hover{
    transform:scale(1.04);
}

/* FOOTER */

footer{
    background:#002855;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:40px;
}

footer p{
    margin-bottom:8px;
}

/* MOBILE VIEW */

@media(max-width:768px){

header h1{
    font-size:28px;
}

header p{
    font-size:14px;
}

nav{
    padding:10px;
}

nav a{
    display:inline-block;
    margin:5px;
    font-size:14px;
}

.gallery-section{
    padding:40px 15px;
}

.gallery-section h2{
    font-size:30px;
}

.gallery-grid img{
    height:220px;
}

footer{
    font-size:13px;
}

}
/* LIGHTBOX */

#lightbox{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.9);

justify-content:center;

align-items:center;

z-index:9999;

}

#lightbox img{

max-width:90%;

max-height:90%;

border-radius:10px;

}

#closeLightbox{

position:absolute;

top:20px;

right:40px;

font-size:45px;

color:white;

cursor:pointer;

font-weight:bold;

}
</style>

</head>

<body>

<!-- HEADER -->

<header>

<img src="logo.jpg" alt="School Logo">

<h1>Maryam Memorial Institute</h1>

<script type="module">

import { db } from "./firebase-config.js";

import {

collection,
getDocs,
query,
orderBy

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const latestGallery=document.getElementById("latestGallery");

async function loadGallery(){

const q=query(

collection(db,"gallery"),

orderBy("createdAt","desc")

);

const snapshot=await getDocs(q);

snapshot.forEach(doc=>{

const image=doc.data();

latestGallery.innerHTML += `
<div>
    <img src="${image.imageUrl}" alt="School Photo">
</div>
`;

});

}

loadGallery();

</script>
<!-- Image Lightbox -->

<div id="lightbox">

    <span id="closeLightbox">&times;</span>

    <img id="lightboxImage">

</div>
<script>

document.addEventListener("click",function(e){

if(e.target.tagName==="IMG" && !e.target.closest("header")){

document.getElementById("lightbox").style.display="flex";

document.getElementById("lightboxImage").src=e.target.src;

}

});

document.getElementById("closeLightbox").onclick=function(){

document.getElementById("lightbox").style.display="none";

};

document.getElementById("lightbox").onclick=function(e){

if(e.target.id==="lightbox"){

this.style.display="none";

}

};

</script>
</body>
