<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Alumni</title>

<link rel="stylesheet" href="dashboard.css">

<style>

.content{
    margin-left:260px;
    padding:40px;
}

.content h1{
    color:#002855;
    margin-bottom:30px;
}

.alumni-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:25px;
}

.alumni-card{
    background:white;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    padding:20px;
    text-align:center;
}

.alumni-card img{
    width:170px;
    height:170px;
    object-fit:contain;
    background:#f5f5f5;
    border-radius:10px;
    border:2px solid #004080;
    padding:8px;
    margin-bottom:15px;
}

.alumni-card h3{
    color:#002855;
    margin-bottom:10px;
}

.alumni-card p{
    margin:8px 0;
    color:#444;
}

.emailBtn{

    display:block;

    width:100%;

    margin-top:15px;

    background:#198754;

    color:white;

    text-decoration:none;

    padding:12px;

    border-radius:8px;

}

.emailBtn:hover{

    background:#157347;

}

.deleteBtn{

    width:100%;

    margin-top:12px;

    background:#dc3545;

    color:white;

    border:none;

    padding:12px;

    border-radius:8px;

    cursor:pointer;

}

.deleteBtn:hover{

    background:#b02a37;

}

</style>

</head>
