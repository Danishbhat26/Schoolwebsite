<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Grievances</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
}

header{
    background:#004080;
    color:white;
    padding:20px;
    text-align:center;
}

#grievanceContainer{
    max-width:1200px;
    margin:30px auto;
    padding:20px;
}

.card{

    background:white;

    padding:20px;

    margin-bottom:20px;

    border-radius:10px;

    box-shadow:0 4px 12px rgba(0,0,0,.15);

}

.card h3{
    color:#004080;
}

.card p{
    margin:8px 0;
}

button{

    padding:10px 18px;

    margin-top:12px;

    margin-right:10px;

    border:none;

    border-radius:6px;

    cursor:pointer;

    color:white;

}

.resolveBtn{

    background:green;

}

.deleteBtn{

    background:red;

}

</style>

</head>

<body>

<header>

<h1>📋 Manage Grievances</h1>

</header>

<div id="grievanceContainer">

Loading...

</div>
<script type="module" src="auth-guard.js"></script>

</html>
